<defs>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6C63FF" stop-opacity="0"/><stop offset=".5" stop-color="#6C63FF" stop-opacity=".16"/><stop offset="1" stop-color="#6C63FF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FF6BD6"/><stop offset=".5" stop-color="#8F88FF"/><stop offset="1" stop-color="#00E5FF"/>
  </linearGradient>
  <radialGradient id="glow" cx="85%" cy="10%" r="80%">
    <stop offset="0" stop-color="#1B1464" stop-opacity=".9"/><stop offset="1" stop-color="#0B0D17" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="c"><rect x="1" y="1" width="638" height="388" rx="16"/></clipPath>
  <style>
    .tw{animation:tw 4s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}
    .row{animation:row .7s ease-out both}
    @keyframes row{from{opacity:0;transform:translateX(-14px)}}
    .blink{animation:blink 1.2s steps(2,start) infinite}
    @keyframes blink{50%{opacity:0}}
    .scan{animation:scan 5s linear infinite}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(360px)}}
    .run{stroke-dasharray:14 86;animation:run 6s linear infinite}
    @keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
    .fadein{animation:fadein 1s ease-out 4.2s both}
    @keyframes fadein{from{opacity:0}}
  </style>
</defs>
